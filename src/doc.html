<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TRVLFZE86D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-TRVLFZE86D');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v={{ver}}">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="{{homeHref}}" aria-label="{{brand}}" dir="ltr"><svg class="globe" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="24" cy="24" r="20"/><ellipse cx="24" cy="24" rx="9" ry="20"/><path d="M5 17.5h38M5 30.5h38" opacity=".55"/></g><circle cx="24" cy="24" r="11" fill="currentColor"/><text x="24" y="31" text-anchor="middle" font-size="19" font-weight="800" font-family="Arial,Helvetica,sans-serif" style="fill:var(--accent)">$</text></svg><span class="wm"><span class="rot">Kama</span> Tip?</span></a>
    <div class="right">
      <small>{{tagline}}</small>
      <a class="langbtn" href="{{langHref}}" hreflang="{{other_lang}}" lang="{{other_lang}}" aria-label="{{lang_aria}}">{{lang_label}}</a>
    </div>
  </header>
  <div class="doc-hero">
    <h1>{{privacy_h1}}</h1>
    <p>{{privacy_lead}}</p>
  </div>
</div>

<section class="article"><div class="wrap">
  <p class="meta-line" style="margin-top:0">{{updated_line}}</p>
  {{content}}
  <p style="margin-top:28px"><a href="{{homeHref}}">{{back_home}}</a></p>
</div></section>

<footer><div class="wrap">
  <span>{{foot}} · <a href="{{privacyHref}}">{{privacy_link}}</a> · {{a11yLink}}</span>
  {{contactBtn}}
</div></footer>
<script src="/a11y.js?v={{ver}}" defer></script>
</body>
</html>
